name: Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: Go version used by the service.
        required: false
        type: string
        default: "1.26.4"
      working-directory:
        description: Directory containing go.mod.
        required: false
        type: string
        default: "."
      run-race:
        description: Run tests with the race detector.
        required: false
        type: boolean
        default: true
      run-vet:
        description: Run go vet.
        required: false
        type: boolean
        default: true
      run-coverage:
        description: Generate and upload test coverage reports.
        required: false
        type: boolean
        default: true
      run-sast:
        description: Run gosec static application security testing.
        required: false
        type: boolean
        default: true
      run-sca:
        description: Run govulncheck software composition analysis.
        required: false
        type: boolean
        default: true
      gosec-version:
        description: Version of gosec to install.
        required: false
        type: string
        default: "v2.27.1"
      gosec-artifact-path:
        description: Path to the gosec SARIF report, relative to working-directory.
        required: false
        type: string
        default: gosec.sarif
      govulncheck-artifact-path:
        description: Path to the govulncheck JSON report, relative to working-directory.
        required: false
        type: string
        default: govulncheck.json

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.mod

      - name: Download modules
        run: go mod download

      - name: Vet
        if: ${{ inputs.run-vet }}
        run: go vet ./...

      - name: Test
        shell: bash
        env:
          RUN_COVERAGE: ${{ inputs.run-coverage }}
          RUN_RACE: ${{ inputs.run-race }}
        run: |
          args=(-v)
          if [ "$RUN_RACE" = "true" ]; then
            args+=(-race)
          fi
          if [ "$RUN_COVERAGE" = "true" ]; then
            args+=(-covermode=atomic -coverprofile=coverage.out)
          fi
          go test "${args[@]}" ./...

      - name: Generate coverage reports
        if: ${{ inputs.run-coverage }}
        run: |
          go tool cover -func=coverage.out > coverage.txt
          go tool cover -html=coverage.out -o coverage.html
          {
            echo "## Test coverage"
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ always() && inputs.run-coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            ${{ inputs.working-directory }}/coverage.out
            ${{ inputs.working-directory }}/coverage.txt
            ${{ inputs.working-directory }}/coverage.html
          if-no-files-found: error
          retention-days: 14

      - name: Build server
        run: go build -v ./cmd/server

  sast:
    name: SAST (gosec)
    if: ${{ inputs.run-sast }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.mod

      - name: Install gosec
        env:
          GOSEC_VERSION: ${{ inputs.gosec-version }}
        run: go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}

      - name: Run gosec
        id: gosec
        continue-on-error: true
        run: gosec -exclude-generated -fmt sarif -out "${{ inputs.gosec-artifact-path }}" ./...

      - name: Upload gosec report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: go-sast-gosec
          path: ${{ inputs.working-directory }}/${{ inputs.gosec-artifact-path }}
          if-no-files-found: warn
          retention-days: 14

      - name: Fail on gosec findings
        if: ${{ steps.gosec.outcome == 'failure' }}
        run: exit 1

  sca:
    name: SCA (govulncheck)
    if: ${{ inputs.run-sca }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        id: govulncheck
        continue-on-error: true
        run: govulncheck -json ./... > "${{ inputs.govulncheck-artifact-path }}"

      - name: Upload govulncheck report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: go-sca-govulncheck
          path: ${{ inputs.working-directory }}/${{ inputs.govulncheck-artifact-path }}
          if-no-files-found: warn
          retention-days: 14

      - name: Fail on govulncheck findings
        if: ${{ steps.govulncheck.outcome == 'failure' }}
        run: exit 1
