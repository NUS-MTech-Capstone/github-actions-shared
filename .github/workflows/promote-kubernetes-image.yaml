name: Promote Kubernetes Image

on:
  workflow_call:
    inputs:
      service-name:
        description: Service name used in branch, commit, and PR text.
        required: true
        type: string
      image-name:
        description: Existing Kustomize image name to update.
        required: true
        type: string
      image-tag:
        description: Source tag for traceability; legacy fallback when image-digest is omitted.
        required: true
        type: string
      image-digest:
        description: Exact sha256 image digest returned by the successful build.
        required: false
        type: string
        default: ""
      kubernetes-repository:
        description: GitOps repository containing Kubernetes manifests.
        required: false
        type: string
        default: NUS-MTech-Capstone/kubernetes
      kustomization-path:
        description: Kustomization file to update.
        required: false
        type: string
        default: apps/dendenmushi/overlays/dev/kustomization.yaml
      render-path:
        description: Kustomize directory to render after updating the image.
        required: false
        type: string
        default: apps/dendenmushi/overlays/dev
      base-branch:
        description: GitOps base branch tracked by Argo CD.
        required: false
        type: string
        default: main
    secrets:
      GITOPS_TOKEN:
        description: Fine-scoped token or GitHub App token with pull request write access to the Kubernetes repository.
        required: true

permissions:
  contents: read

jobs:
  promote:
    name: Promote
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kubernetes repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.kubernetes-repository }}
          ref: ${{ inputs.base-branch }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: kubernetes

      - name: Update Kustomize image reference
        working-directory: kubernetes
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          KUSTOMIZATION_PATH: ${{ inputs.kustomization-path }}
        run: |
          ruby <<'RUBY'
          require "yaml"
          path = ENV.fetch("KUSTOMIZATION_PATH")
          image_name = ENV.fetch("IMAGE_NAME")
          tag = ENV.fetch("IMAGE_TAG")
          digest = ENV.fetch("IMAGE_DIGEST", "")
          abort "invalid image tag" unless tag.match?(/\A[\w][\w.-]{0,127}\z/)
          abort "invalid image digest" unless digest.empty? || digest.match?(/\Asha256:[a-f0-9]{64}\z/)
          document = YAML.load_file(path)
          entries = document.fetch("images").select { |entry| entry["name"] == image_name }
          abort "expected exactly one image match for #{image_name}" unless entries.length == 1
          entry = entries.first
          if digest.empty?
            # A legacy caller must not downgrade an already digest-pinned deployment.
            abort "digest required for an already pinned image" if entry.key?("digest")
          else
            entry.delete("newTag")
          end
          key, value = digest.empty? ? ["newTag", tag] : ["digest", digest]
          entry[key] = value

          # Preserve unrelated formatting and replace only this image's tag/digest lines.
          lines = File.readlines(path)
          index = lines.index { |line| line.match?(/^\s*- name: #{Regexp.escape(image_name)}\s*$/) }
          abort "image entry not found" unless index
          indent = lines[index][/^\s*/].length
          finish = index + 1
          while finish < lines.length && (lines[finish].strip.empty? || lines[finish][/^\s*/].length > indent)
            finish += 1
          end
          block = lines[index...finish].reject { |line| line.match?(/^\s+(newTag|digest):/) }
          block.insert(block.index { |line| line.strip.empty? } || block.length, "#{' ' * (indent + 2)}#{key}: #{value}\n")
          lines[index...finish] = block
          updated = lines.join
          actual = YAML.safe_load(updated).fetch("images").find { |item| item["name"] == image_name }
          abort "image update validation failed" unless actual == entry
          File.write(path, updated)
          RUBY

      - name: Render Kustomize overlay
        working-directory: kubernetes
        run: kubectl kustomize "${{ inputs.render-path }}" >/dev/null

      - name: Create promotion pull request
        working-directory: kubernetes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          SERVICE_NAME: ${{ inputs.service-name }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          BASE_BRANCH: ${{ inputs.base-branch }}
          KUSTOMIZATION_PATH: ${{ inputs.kustomization-path }}
          KUBERNETES_REPOSITORY: ${{ inputs.kubernetes-repository }}
        run: |
          if git diff --quiet -- "${KUSTOMIZATION_PATH}"; then
            echo "No GitOps change required for ${SERVICE_NAME}:${IMAGE_TAG}."
            exit 0
          fi

          release_id="${IMAGE_TAG}"
          if [ -n "$IMAGE_DIGEST" ]; then
            release_id="${IMAGE_TAG}-${IMAGE_DIGEST#sha256:}"
          fi
          branch="promote/${SERVICE_NAME}-${release_id}"
          git config user.name "dendenmushi-gitops-bot"
          git config user.email "dendenmushi-gitops-bot@users.noreply.github.com"
          git checkout -B "${branch}"
          git add "${KUSTOMIZATION_PATH}"
          git commit -m "chore: promote ${SERVICE_NAME} image ${IMAGE_TAG}"
          git push --force-with-lease origin "${branch}"

          title="chore: promote ${SERVICE_NAME} image ${IMAGE_TAG}"
          body_file=$(mktemp)
          cat > "$body_file" <<EOF
          Promotes \`${SERVICE_NAME}\` from source tag \`${IMAGE_TAG}\` to digest \`${IMAGE_DIGEST:-legacy-tag-reference}\` in the dev GitOps overlay.

          The image was published only after its source CI passed. Kustomize rendering passed before this PR was opened.
          EOF
          if gh pr view "${branch}" --repo "${KUBERNETES_REPOSITORY}" >/dev/null 2>&1; then
            gh pr edit "${branch}" \
              --repo "${KUBERNETES_REPOSITORY}" \
              --title "${title}" \
              --body-file "$body_file"
          else
            gh pr create \
              --repo "${KUBERNETES_REPOSITORY}" \
              --base "${BASE_BRANCH}" \
              --head "${branch}" \
              --title "${title}" \
              --body-file "$body_file"
          fi
