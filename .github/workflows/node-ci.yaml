name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used for install, test, and build.
        required: false
        type: string
        default: "22"
      working-directory:
        description: Directory containing package-lock.json.
        required: false
        type: string
        default: .
      run-lint:
        description: Run the configured lint command.
        required: false
        type: boolean
        default: false
      lint-command:
        description: Non-mutating lint command.
        required: false
        type: string
        default: npm run lint
      test-command:
        description: Test command.
        required: false
        type: string
        default: npm test
      build-command:
        description: Production build command.
        required: false
        type: string
        default: npm run build
      test-artifact-paths:
        description: Test and coverage artifact paths, relative to working-directory.
        required: false
        type: string
        default: coverage/**
      coverage-lcov-path:
        description: lcov coverage report path, relative to working-directory. Leave empty to skip coverage summary generation.
        required: false
        type: string
        default: coverage/lcov.info
      run-sast:
        description: Run Semgrep static application security testing.
        required: false
        type: boolean
        default: true
      sast-command:
        description: Static application security testing command.
        required: false
        type: string
        default: semgrep scan --error --config auto --sarif --output semgrep.sarif .
      sast-artifact-path:
        description: Semgrep report path, relative to working-directory.
        required: false
        type: string
        default: semgrep.sarif
      run-sca:
        description: Run npm audit software composition analysis.
        required: false
        type: boolean
        default: true
      sca-command:
        description: Software composition analysis command.
        required: false
        type: string
        default: npm audit --omit=dev --audit-level=high --json > npm-audit.json
      sca-artifact-path:
        description: npm audit report path, relative to working-directory.
        required: false
        type: string
        default: npm-audit.json

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    if: ${{ inputs.run-lint }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        shell: bash
        env:
          LINT_COMMAND: ${{ inputs.lint-command }}
        run: |
          set -o pipefail
          bash -c "$LINT_COMMAND" 2>&1 | tee lint.log

      - name: Upload lint artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: node-lint-artifacts
          path: ${{ inputs.working-directory }}/lint.log
          if-no-files-found: ignore
          retention-days: 14

  test:
    name: Test
    needs: lint
    if: ${{ always() && needs.lint.result != 'failure' && needs.lint.result != 'cancelled' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: ${{ inputs.test-command }}

      - name: Generate coverage summary
        if: ${{ always() && inputs.coverage-lcov-path != '' }}
        shell: bash
        env:
          LCOV_PATH: ${{ inputs.coverage-lcov-path }}
        run: |
          if [ ! -f "$LCOV_PATH" ]; then
            echo "Coverage report ${LCOV_PATH} was not found; skipping summary."
            exit 0
          fi

          node <<'NODE'
          const fs = require("fs");
          const path = process.env.LCOV_PATH;
          const lcov = fs.readFileSync(path, "utf8");
          const metrics = {
            lines: { hit: 0, found: 0 },
            functions: { hit: 0, found: 0 },
            branches: { hit: 0, found: 0 },
          };

          for (const line of lcov.split(/\r?\n/)) {
            const [key, value] = line.split(":");
            const number = Number(value);
            if (!Number.isFinite(number)) continue;

            if (key === "LH") metrics.lines.hit += number;
            if (key === "LF") metrics.lines.found += number;
            if (key === "FNH") metrics.functions.hit += number;
            if (key === "FNF") metrics.functions.found += number;
            if (key === "BRH") metrics.branches.hit += number;
            if (key === "BRF") metrics.branches.found += number;
          }

          const percent = ({ hit, found }) => found === 0 ? "n/a" : `${((hit / found) * 100).toFixed(2)}%`;
          const rows = [
            ["Lines", metrics.lines],
            ["Functions", metrics.functions],
            ["Branches", metrics.branches],
          ];
          const markdown = [
            "## Test coverage",
            "",
            "| Metric | Covered | Total | Coverage |",
            "| --- | ---: | ---: | ---: |",
            ...rows.map(([name, metric]) => `| ${name} | ${metric.hit} | ${metric.found} | ${percent(metric)} |`),
            "",
          ].join("\n");

          fs.writeFileSync("coverage-summary.md", markdown);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown);
          NODE

      - name: Upload test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: node-test-artifacts
          path: |
            ${{ inputs.working-directory }}/${{ inputs.test-artifact-paths }}
            ${{ inputs.working-directory }}/coverage-summary.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: ${{ inputs.build-command }}

  sast:
    name: SAST (Semgrep)
    if: ${{ inputs.run-sast }}
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        env:
          SAST_COMMAND: ${{ inputs.sast-command }}
          REPORT_PATH: ${{ inputs.sast-artifact-path }}
        shell: bash
        run: |
          scan_status=0
          bash -c "$SAST_COMMAND" || scan_status=$?
          python3 - <<'PY'
          import json, os, pathlib, sys
          report = json.loads(pathlib.Path(os.environ["REPORT_PATH"]).read_text())
          runs = report.get("runs")
          if report.get("version") != "2.1.0" or not isinstance(runs, list) or not runs:
              sys.exit("Missing or malformed Semgrep SARIF report")
          findings = 0
          for run in runs:
              if not isinstance(run.get("results"), list):
                  sys.exit("Missing Semgrep results")
              for invocation in run.get("invocations", []):
                  if invocation.get("executionSuccessful") is False:
                      sys.exit("Semgrep reported unsuccessful execution")
              for result in run["results"]:
                  if not isinstance(result, dict) or not result.get("ruleId"):
                      sys.exit("Malformed Semgrep result")
                  # Only explicit scanner-accepted suppressions are excluded.
                  if not any(s.get("status") == "accepted" for s in result.get("suppressions", [])):
                      findings += 1
          if findings:
              sys.exit(f"Semgrep reported {findings} unsuppressed findings")
          print("No unsuppressed Semgrep findings")
          PY
          exit "$scan_status"

      - name: Upload Semgrep report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: node-sast-semgrep
          path: ${{ inputs.working-directory }}/${{ inputs.sast-artifact-path }}
          if-no-files-found: warn
          retention-days: 14

      - name: Fail on Semgrep findings
        if: ${{ steps.semgrep.outcome == 'failure' }}
        run: exit 1

  sca:
    name: SCA (npm audit)
    if: ${{ inputs.run-sca }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: npm-audit
        continue-on-error: true
        run: ${{ inputs.sca-command }}

      - name: Upload npm audit report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: node-sca-npm-audit
          path: ${{ inputs.working-directory }}/${{ inputs.sca-artifact-path }}
          if-no-files-found: warn
          retention-days: 14

      - name: Fail on npm audit findings
        if: ${{ steps.npm-audit.outcome == 'failure' }}
        run: exit 1
