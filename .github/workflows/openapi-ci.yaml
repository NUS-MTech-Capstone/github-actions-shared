name: OpenAPI contract validation

on:
  workflow_call:
    inputs:
      specification:
        description: Checked-in OpenAPI specification to validate.
        required: false
        type: string
        default: api/openapi.yaml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned specification validator
        run: python -m pip install openapi-spec-validator==0.9.0
      - name: Validate OpenAPI
        shell: bash
        env:
          SPECIFICATION: ${{ inputs.specification }}
        run: |
          set -o pipefail
          python -m openapi_spec_validator "$SPECIFICATION" 2>&1 | tee openapi-validation.log
      - name: Retain validation result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: openapi-validation
          path: |
            openapi-validation.log
            ${{ inputs.specification }}
          if-no-files-found: error
          retention-days: 90
